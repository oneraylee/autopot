[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-training-platform-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.116,<1.0",
	"uvicorn>=0.35,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
